<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实例运行中 · PPanel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #10b981;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 540px;
    background: #ffffff;
    border: 1px solid rgba(16, 185, 129, .28);
    border-radius: 20px;
    padding: 40px 36px 28px;
    box-shadow: 0 18px 50px rgba(16, 185, 129, .14);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #ecfdf5;
    border: 1px solid rgba(16, 185, 129, .4);
    color: #10b981;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #10b981;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, .45); }
    70%  { box-shadow: 0 0 0 9px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  h1 { font-size: 26px; margin: 20px 0 8px; color: #059669; letter-spacing: .5px; }
  .sub { color: #34b48f; font-size: 14px; line-height: 1.7; }
  .rows { margin: 26px 0 22px; border: 1px solid rgba(16, 185, 129, .22); border-radius: 14px; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; font-size: 14px; background: #f7fdfb; }
  .row + .row { border-top: 1px solid rgba(16, 185, 129, .16); }
  .k { color: #4fb894; flex-shrink: 0; }
  .v { color: #0d9e74; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; text-align: right; word-break: break-all; }
  .v.ok { color: #10b981; }
  .tip {
    font-size: 13px;
    color: #34b48f;
    line-height: 1.9;
    background: #f2fdf8;
    border: 1px dashed rgba(16, 185, 129, .45);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .tip code {
    color: #059669;
    font-family: ui-monospace, Consolas, monospace;
    background: #d9f7ea;
    padding: 1px 6px;
    border-radius: 6px;
  }
  .foot { margin-top: 22px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6fc9ab; }
  .logo {
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #10b981, #2dd4bf);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  @media (max-width: 480px) {
    .card { padding: 30px 22px 22px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<main class="card">
  <span class="badge"><span class="dot"></span>运行正常 · ALL SYSTEMS GO</span>
  <h1>您的实例已成功启动</h1>
  <p class="sub">主机服务运行正常，Web 服务已就绪并正在监听端口，现在可以开始部署您的应用了。</p>
  <div class="rows">
    <div class="row"><span class="k">运行环境</span><span class="v ok">%%RUNTIME%%</span></div>
    <div class="row"><span class="k">入口文件</span><span class="v">%%ENTRY%%</span></div>
    <div class="row"><span class="k">监听地址</span><span class="v">0.0.0.0:8000</span></div>
    <div class="row"><span class="k">服务状态</span><span class="v ok">Healthy</span></div>
  </div>
  <div class="tip">编辑入口文件 <code>%%ENTRY%%</code> 替换为您自己的应用，保存后点击面板中的「重启」即可生效。您也可以在面板中管理文件、安装依赖和使用数据库。</div>
  <div class="foot"><span class="logo">PPANEL</span><span id="clock"></span></div>
</main>
<script>
  function tick () {
    var el = document.getElementById("clock");
    if (el) el.textContent = new Date().toLocaleString("zh-CN", { hour12: false });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
