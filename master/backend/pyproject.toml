[project]
name = "ppanel-master"
version = "0.1.0"
description = "PPanel 主控：用户/节点/实例编排 + 被控转发 + 商城对接"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "websockets>=13.0",
]

# pip 兜底安装需要构建项目：显式指定包，避免 data/ 等运行时目录被当成包导致 flat-layout 歧义
[tool.setuptools.packages.find]
include = ["app*"]
